<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zeittracker">
  <title>Zeittracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Zeittracker</h1>
    <p id="gesamt" class="gesamt"></p>
  </header>

  <main>
    <ul id="liste" class="liste"></ul>
    <p id="leer" class="leer" hidden>Noch keine Aktivitäten. Lege unten deine erste an.</p>
  </main>

  <form id="neu" class="neu" autocomplete="off">
    <input id="neu-name" type="text" placeholder="Neue Aktivität" aria-label="Name der neuen Aktivität" maxlength="40" enterkeyhint="done">
    <button type="submit">Hinzufügen</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
